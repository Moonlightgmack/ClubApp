<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{{ NOM_APPLICATION }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css')}} "  >
</head>
<body>
  <!-- {# TODO (partie B) : en-tête <header> contenant le nom de l'application
     (lien vers /) et une navigation <nav> avec une liste de liens. #} -->
    <header class="entete">
      <div class="conteneur entete__barre">
        <h1><a class="logo" href="/">{{ NOM_APPLICATION }}</a></h1>
        <nav aria-label="Navigation principale">
          <ul class="menu">
            <li><a href="/">Acceuil</a></li>
            <li><a href="/clubs/nouveau">Creer un club</a></li>
          </ul>
        </nav>
      </div>
    </header>

  <main id="contenu">
    {% block contenu %}{% endblock %}
  </main>

  <!-- {# TODO (partie B) : pied de page <footer>. #} -->
  <footer>
    <p>{{ NOM_APPLICATION }}, Université Adventiste Cosendai · Projet File Rouge « Conception Web 1</p>
  </footer>
</body>
</html>
