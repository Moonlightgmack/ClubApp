{%extends "base.html"%}

{%block contenu%}
<section>
   <h1 class="h1">Creer un club</h1>
   <form action="" class="creation-form">
     <label for="nom">Nom du club:</label><br>
     <input type="text" name="nom"required><br>
     <label for="description">Description:</label><br>
     <textarea name="description" id="" required></textarea><br>
     <label for="capacite">Capacite:</label><br>
     <input type="number" required><br>
     <button type="submit" class="btn-creer">Creer</button>
     <button type="submit" class="btn-annuler">Annuler</button>
   </form>
</section>

{%endblock%}
