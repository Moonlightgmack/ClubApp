{%extends "base.html" %}

{%block contenu%}
<article class="club_details">
    <h1 class="h1">Club details</h1>

    <div>
        <h1>{{club.nom}}</h1>
        <p class="club-description">{{club.description}}</p>
        <p class="club-capacity">{{club.capacite}} place(s) disponible</p>
        <form action="/clubs/{{ club.id }}/adhesions" method="post">
            <button type="submit" class="btn-rejoindre"><a href="">Rejoindre</a></button>
            <button type="submit" class="btn-quitter"><a href="">quitter</a></button>
        </form>
        <a href="/">Retour a l'Acceuil</a>
    </div>
</article>

{%endblock%}
